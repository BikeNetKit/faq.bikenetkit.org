<!doctype html>
<html>
  <head>
    <title>BikeNetKit FAQ</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <!-- Core Theme -->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css">

    <!-- Custom theme styles -->
    <style>
      :root {
        --theme-color: #096a51;
        --font-size  : 18px;
        --line-height: 1.4;
      }
    </style>
  </head>
  <body class="loading sidebar-toggle-chevron">
    <div id="app"></div>

    <script src="//cdn.jsdelivr.net/npm/docsify-edit-on-github"></script>
    <!-- Configuration -->
    <script>
      window.$docsify = {
        logo: 'https://github.com/BikeNetKit/.github/blob/main/profile/_static/logo_bikenetkit.svg',
        name: 'BikeNetKit FAQ', // inferred from <title>
        nameLink: 'https://bikenetkit.org',
        repo: 'https://github.com/BikeNetKit/',
        search: 'auto',
        plugins: [
          EditOnGithubPlugin.create('https://github.com/BikeNetKit/faq.bikenetkit.org/tree/main/docs/')
        ]
      };
    </script>

    <!-- Docsify.js -->
    <script src="//cdn.jsdelivr.net/npm/docsify@5"></script>

    <!-- Plugins (optional) -->
    <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/plugins/search.min.js"></script>

</html>
